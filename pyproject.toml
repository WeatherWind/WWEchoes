[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wwechoes"
version = "0.1.0"
description = "WWEchoes — 鸣潮声骸实时评分悬浮工具（只读截图，合规边界见 docs/adr/0003）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "WeatherWind" }]
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "rapidocr-onnxruntime>=1.3.16",
    "windows-capture>=1.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.gui-scripts]
wwechoes = "wwechoes.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wwechoes = ["scoring/data/*.json", "scoring/data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
